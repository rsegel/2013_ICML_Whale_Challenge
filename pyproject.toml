[project]
name = "whale"
version = "0.1.0"
description = "Right whale upcall detection: spectrogram CNN baseline vs Perch v2 embeddings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "soundfile>=0.12",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "onnxruntime>=1.31.1",
    "huggingface-hub>=2.4.0",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "wandb>=0.31.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
